name: CD

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  JAVA_VERSION: "17"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.ref_name }}
  ARCHIVE_NAME: seneid-distribution.tar.gz

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_RELEASE="true"
            IMAGE_TAG="${VERSION}"
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            VERSION="${GITHUB_REF_NAME#release/}"
            IS_RELEASE="true"
            IMAGE_TAG="${VERSION}"
          else
            VERSION="0.0.0-SNAPSHOT"
            IS_RELEASE="false"
            IMAGE_TAG="snapshot"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven tests
        run: |
          ./mvnw --batch-mode clean test

      - name: Package application
        run: |
          ./mvnw --batch-mode -DskipTests package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/
            **/target/*.jar
          retention-days: 7

  package:
    name: Package distribution
    runs-on: ubuntu-latest
    needs: [release, build]
    outputs:
      archive_path: ${{ steps.package.outputs.archive_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build distribution archive
        id: package
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          DIST_DIR="dist"
          mkdir -p "${DIST_DIR}"

          ./mvnw --batch-mode -DskipTests package

          tar -czf "${DIST_DIR}/${ARCHIVE_NAME}" -C target . || {
            echo "Distribution archive creation failed"
            exit 1
          }

          echo "archive_path=${DIST_DIR}/${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: seneid-package
          path: dist/${{ env.ARCHIVE_NAME }}
          retention-days: 30

  store:
    name: Store artifact
    runs-on: ubuntu-latest
    needs: [release, package]
    if: needs.release.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: seneid-package
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: dist/${{ env.ARCHIVE_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [release, package]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: seneid-package
          path: dist

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build container image
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository }}:${VERSION}"
          LATEST="ghcr.io/${{ github.repository }}:latest"

          podman build -t "${IMAGE}" -t "${LATEST}" .
          podman push "${IMAGE}"
          podman push "${LATEST}"

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' }}
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          SOURCE="ghcr.io/${{ github.repository }}:${VERSION}"
          TARGET="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/seneid:${VERSION}"
          TARGET_LATEST="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/seneid:latest"

          podman pull "${SOURCE}"
          podman tag "${SOURCE}" "${TARGET}"
          podman tag "${SOURCE}" "${TARGET_LATEST}"
          podman push "${TARGET}"
          podman push "${TARGET_LATEST}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [release, container]
    if: needs.release.outputs.is_release == 'true'
    environment:
      name: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            VERSION="${{ needs.release.outputs.version }}"
            IMAGE="ghcr.io/${{ github.repository }}:${VERSION}"

            echo "Pulling image ${IMAGE}"
            podman pull "${IMAGE}" || docker pull "${IMAGE}"

            cd "${{ secrets.DEPLOY_DIR }}" || exit 1

            if [ -f docker-compose.yml ]; then
              if grep -q "image:" docker-compose.yml; then
                sed -i "s#image: .*#image: ${IMAGE}#g" docker-compose.yml
              else
                echo "image: ${IMAGE}" >> docker-compose.yml
              fi
            fi

            if command -v docker >/dev/null 2>&1; then
              docker compose pull
              docker compose up -d --force-recreate
            elif command -v podman >/dev/null 2>&1; then
              podman compose pull
              podman compose up -d --force-recreate
            else
              echo "Neither docker nor podman is available on target host"
              exit 1
            fi

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Health check
        shell: bash
        run: |
          set -e
          URL="${{ secrets.HEALTH_URL || 'https://localhost' }}"
          for i in {1..30}; do
            if curl -fsS "${URL}/actuator/health" >/dev/null 2>&1 || curl -fsS "${URL}/health" >/dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt ${i}/30 failed; retrying in 10s..."
            sleep 10
          done
          echo "Health check failed"
          exit 1

      - name: Smoke test
        shell: bash
        run: |
          echo "Smoke tests passed"
          curl -fsS "${{ secrets.HEALTH_URL || 'https://localhost' }}/actuator/health" >/dev/null

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [release]
    if: failure() && needs.release.outputs.is_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous version
        id: previous
        shell: bash
        run: |
          PREVIOUS=$(git tag --sort=-version:refname | head -n 2 | tail -n 1 || true)
          echo "tag=${PREVIOUS}" >> "$GITHUB_OUTPUT"

      - name: SSH rollback
        if: steps.previous.outputs.tag != ''
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            PREVIOUS_TAG="${{ steps.previous.outputs.tag }}"
            IMAGE="ghcr.io/${{ github.repository }}:${PREVIOUS_TAG}"

            echo "Rolling back to ${IMAGE}"
            podman pull "${IMAGE}" || docker pull "${IMAGE}"

            cd "${{ secrets.DEPLOY_DIR }}"
            if [ -f docker-compose.yml ]; then
              sed -i "s#image: .*#image: ${IMAGE}#g" docker-compose.yml
            fi

            if command -v docker >/dev/null 2>&1; then
              docker compose up -d --force-recreate
            elif command -v podman >/dev/null 2>&1; then
              podman compose up -d --force-recreate
            fi
