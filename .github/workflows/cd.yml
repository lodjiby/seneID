name: Continuous Deployment

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/seneid/1.0"

  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ARCHIVE_NAME: seneid-distribution.tar.gz
  DIST_DIR: dist
  PREPROD_DIR: /opt/seneid

jobs:

  # ============================================================
  # 1. BUILD
  # GitHub-hosted runner
  # Maven compile + tests
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          
      - name: Build without test
        run: |
          ../mvnw clean install -DskipTests

      - name: Upload Maven build
        uses: actions/upload-artifact@v4
        with:
          name: maven-build
          path: |
            **/target/*.jar
          retention-days: 7


  # ============================================================
  # 2. PACKAGE
  # GitHub-hosted runner
  # Create .tar.gz distribution
  # ============================================================
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Download Maven build
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: build

      - name: Create distribution directory
        run: |
          mkdir -p "${DIST_DIR}"

      - name: Create distribution archive
        shell: bash
        run: |
          set -euo pipefail

          tar -czf \
            "${DIST_DIR}/${ARCHIVE_NAME}" \
            -C build .

          echo "Distribution created:"
          ls -lh "${DIST_DIR}/${ARCHIVE_NAME}"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: seneid-distribution
          path: ${{ env.DIST_DIR }}/${{ env.ARCHIVE_NAME }}
          retention-days: 30


  # ============================================================
  # 3. STORE
  # GitHub Release
  # Store the .tar.gz for versioned releases
  # ============================================================
  store:
    name: Store
    runs-on: ubuntu-latest
    needs: package

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: seneid-distribution
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 4. CONTAINER
  # GitHub-hosted runner
  # Podman builds ARM64 UBI image
  # Copies .tar.gz into the image
  # ============================================================
  container:
    name: Container
    runs-on: ubuntu-latest
    needs: package

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: seneid-distribution
          path: dist

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login "${REGISTRY}" \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Determine image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="snapshot"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build ARM64 container image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}"

          echo "Building ${IMAGE}"

          podman build \
            --arch arm64 \
            --tag "${IMAGE}" \
            .

      - name: Push container image to GHCR
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}"

          echo "Pushing ${IMAGE}"

          podman push "${IMAGE}"

      - name: Tag and push latest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ steps.image.outputs.tag }}"
          LATEST="${REGISTRY}/${IMAGE_NAME}:latest"

          podman tag "${IMAGE}" "${LATEST}"
          podman push "${LATEST}"


  # ============================================================
  # 5. DEPLOY TO PRE-PRODUCTION
  # Self-hosted GitHub Actions runner
  # Kali ARM64 VM
  # Podman + Podman Compose
  # ============================================================
  deploy:
    name: Deploy to Pre-Production
    runs-on:
      - self-hosted
      - preprod

    needs: container

    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pre-production

    steps:
      - name: Verify deployment environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Deployment machine:"
          hostname

          echo "Architecture:"
          uname -m

          echo "Podman:"
          podman --version

          echo "Podman Compose:"
          podman-compose --version

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          cd "${PREPROD_DIR}"

          echo "Pulling image from GHCR..."

          podman-compose pull

          echo "Starting application..."

          podman-compose up -d --force-recreate

          echo "Deployment status:"

          podman-compose ps

      - name: Show running containers
        shell: bash
        run: |
          podman ps
